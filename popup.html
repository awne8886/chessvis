<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui, sans-serif; width: 250px; max-width: 100%; padding: 12px; }
    h3 { margin: 0 0 10px; }
    .switch { display: flex; align-items: center; justify-content: space-between; font-size: 15px; margin: 12px 0; }
    .switch input { width: 22px; height: 22px; }
    p { font-size: 12px; color: #555; margin: 8px 0 0; line-height: 1.4; }
  </style>
</head>
<body>
  <h3>ChessVision</h3>
  <div class="switch">
    <span>Auto-play</span>
    <input type="checkbox" id="enabled">
  </div>
  <p>All other settings (engine, depth, delays, human-like play, quick replies, watchdog) are in the ChessVision panel shown on chess.com bot games.</p>
  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
